# vim: set ft=yaml:
#
# Only non-default overrides are listed here; everything else uses
# cmake-format's built-in defaults. To see the full option reference with
# defaults and help text, run:  cmake-format --dump-config yaml
format:
  disable: true

  tab_size: 2
  line_width: 100

  max_subgroups_hwrap: 2
  # max_pargs_hwrap: 6

  min_prefix_chars: 2
  # max_prefix_chars: 10
  max_lines_hwrap: 0

  dangle_parens: true

  # always_wrap:
  #   # - add_library
  #   # - install
  #   - target_include_directories
  #   - target_link_libraries

markup:
  # Treat comments as literal text; do not reflow or rewrap them
  # (keeps #####... banner lines intact).
  enable_markup: false
