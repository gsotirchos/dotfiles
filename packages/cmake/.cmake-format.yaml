# vim: set ft=yaml:
# cmake-format configuration.
#
# Only non-default overrides are listed here; everything else uses
# cmake-format's built-in defaults. To see the full option reference with
# defaults and help text, run:  cmake-format --dump-config yaml

format:
  # Allow wider lines than the 80-column default.
  line_width: 100

  # Enforce a vertical, one-argument-per-line style: as soon as a command
  # has more than one positional argument, or would wrap past a single line,
  # break every argument onto its own line instead of packing horizontally.
  max_pargs_hwrap: 1
  max_lines_hwrap: 1
  max_rows_cmdline: 1

  # Put the closing paren on its own line, aligned to the statement start.
  dangle_parens: true

  # Permit prefix-aligned (un-nested) layouts up to nearly the full line
  # width. NOTE: this pulls against the vertical/dangle style above; drop
  # this line (default is 10) if you'd rather force nested layouts more often.
  max_prefix_chars: 98

markup:
  # Treat comments as literal text; do not reflow or rewrap them.
  enable_markup: false
