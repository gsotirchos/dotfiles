[ids]
*
# Exclude xremap's virtual output device (fixed id 1234:5678). Without this,
# keyd's wildcard would re-grab xremap's output and feed it back through the
# keyd virtual keyboard, creating a feedback loop that freezes the keyboard.
-1234:5678

[main]
pageup = left
pagedown = right
capslock = layer(control)
leftalt  = layer(meta)
rightalt  = layer(meta)
leftmeta = layer(alt)
rightmeta = layer(alt)
leftmeta+leftshift+f23 = layer(alt)
calc = M-A-t
