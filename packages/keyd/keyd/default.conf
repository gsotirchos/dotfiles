[ids]
# Match only the built-in laptop keyboard. keyd ignores all other keyboards and
# also never re-grabs xremap's virtual output (id 1234:5678), so no exclusion
# or feedback-loop guard is needed here.
0001:0001

[main]
pageup = left
pagedown = right
capslock = layer(control)
leftalt  = layer(meta)
rightalt  = layer(meta)
leftmeta = layer(alt)
rightmeta = layer(alt)
leftmeta+leftshift+f23 = layer(alt)
calc = M-A-t
