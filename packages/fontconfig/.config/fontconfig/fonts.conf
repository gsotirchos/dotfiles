<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- `accept' appends after Ubuntu Mono, so these only fill its glyph gaps
       instead of replacing it: https://www.freedesktop.org/software/fontconfig/fontconfig-user.html -->
  <alias binding="same">
    <family>Ubuntu Mono</family>
    <accept>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Symbols2</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
