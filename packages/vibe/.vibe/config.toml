vim_keybindings = false
disable_welcome_banner_animation = false
autocopy_to_clipboard = true
file_watcher_for_autocomplete = false
displayed_workdir = ""
context_warnings = false
enable_telemetry = true
system_prompt_id = "cli"
include_commit_signature = false
include_model_info = true
include_project_context = true
include_prompt_detail = true
enable_update_checks = true
enable_auto_update = true
api_timeout = 720.0
mcp_servers = []
enabled_tools = []
disabled_tools = []
agent_paths = []
enabled_agents = []
disabled_agents = []
skill_paths = []
enabled_skills = []
disabled_skills = []
applied_migrations = [
    "bash_read_only_defaults_v1",
]
theme = "auto"

[[providers]]
name = "mistral"
api_base = "https://api.mistral.ai/v1"
api_key_env_var = "MISTRAL_API_KEY"
api_style = "openai"
backend = "mistral"
reasoning_field_name = "reasoning_content"
project_id = ""
region = ""

[[models]]
name = "devstral-small-latest"
provider = "mistral"
alias = "devstral-small"
temperature = 0.2
input_price = 0.1
output_price = 0.3
thinking = "off"

[[models]]
name = "mistral-vibe-cli-latest"
provider = "mistral"
alias = "mistral-medium-3.5"
temperature = 1.0
input_price = 1.5
output_price = 7.5
thinking = "high"
supports_images = true

[[models]]
thinking = "high"
alias = "mistral-large-4-0-3"

[session_logging]
session_prefix = "session"
enabled = true

[tools.task]
permission = "ask"
denylist = []

[tools.bash]
permission = "ask"
allowlist = [
    "basename",
    "cat",
    "emacs-query",
    "glab api",
    "glab repo",
    "comm",
    "cut",
    "date",
    "diff",
    "dirname",
    "du",
    "echo",
    "file",
    "find",
    "fmt",
    "fold",
    "git diff",
    "git log",
    "git status",
    "grep",
    "head",
    "join",
    "less",
    "ls",
    "md5sum",
    "more",
    "nl",
    "od",
    "paste",
    "pwd",
    "readlink",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "tree",
    "uname",
    "uniq",
    "wc",
    "which",
    "whoami",
]
denylist = [
    "gdb",
    "pdb",
    "passwd",
    "nano",
    "vim",
    "vi",
    "emacs",
    "bash -i",
    "sh -i",
    "zsh -i",
    "fish -i",
    "dash -i",
    "screen",
    "tmux",
]
max_output_bytes = 16000
denylist_standalone = [
    "python",
    "python3",
    "ipython",
    "bash",
    "sh",
    "nohup",
    "vi",
    "vim",
    "emacs",
    "nano",
    "su",
]

[tools.grep]
permission = "always"
allowlist = []
denylist = []
max_output_bytes = 64000
default_max_matches = 100
default_timeout = 60
codeignore_file = ".vibeignore"

[tools.ask_user_question]
permission = "always"
allowlist = []
denylist = []

[tools.read_file]
permission = "always"
allowlist = []
denylist = []
max_read_bytes = 64000

[tools.todo]
permission = "always"
allowlist = []
denylist = []
max_todos = 100

[tools.write_file]
permission = "ask"
allowlist = []
denylist = []
max_write_bytes = 64000
create_parent_dirs = true

[tools.edit]
permission = "ask"
allowlist = []
denylist = []
fuzzy_threshold = 0.9
