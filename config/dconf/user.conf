[org/gnome/Ptyxis/Shortcuts]
move-next-tab='<Control>Tab'
move-previous-tab='<Shift><Control>Tab'

[org/gnome/TextEditor]
custom-font='Ubuntu Mono 12'
use-system-font=false

[org/gnome/desktop/calendar]
show-weekdate=true

[org/gnome/desktop/datetime]
automatic-timezone=true

[org/gnome/desktop/input-sources]
mru-sources=[('xkb', 'us'), ('xkb', 'gr')]
show-all-sources=false
sources=[('xkb', 'us'), ('xkb', 'gr')]
xkb-options=['lv3:ralt_alt']

[org/gnome/desktop/interface]
clock-show-seconds=false
clock-show-weekday=true
font-hinting='none'
font-name='Ubuntu 11'
gtk-key-theme='Emacs'
monospace-font-name='Ubuntu Mono 13'
show-battery-percentage=true

[org/gnome/desktop/peripherals/touchpad]
click-method='fingers'
disable-while-typing=true
tap-to-click=false
two-finger-scrolling-enabled=true

[org/gnome/desktop/wm/keybindings]
activate-window-menu=@as []
begin-move=@as []
begin-resize=@as []
close=['<Shift><Super>w']
cycle-group=['<Super>Escape']
cycle-group-backward=['<Shift><Super>Escape']
cycle-windows=['<Alt>Escape']
cycle-windows-backward=['<Shift><Alt>Escape']
maximize=['<Control><Super>Up']
minimize=['<Super>m']
move-to-monitor-down=@as []
move-to-monitor-left=@as []
move-to-monitor-right=@as []
move-to-monitor-up=@as []
move-to-workspace-1=['<Shift><Alt><Super>Home']
move-to-workspace-last=['<Shift><Alt><Super>End']
move-to-workspace-left=['<Shift><Alt><Super>Left']
move-to-workspace-right=['<Shift><Alt><Super>Right']
show-desktop=@as []
switch-applications=['<Super>Tab']
switch-applications-backward=['<Shift><Super>Tab']
switch-input-source=['<Super>space']
switch-input-source-backward=['<Shift><Super>space']
switch-to-workspace-1=['<Alt><Super>Home']
switch-to-workspace-last=['<Alt><Super>End']
switch-to-workspace-left=['<Alt><Super>Left']
switch-to-workspace-right=['<Alt><Super>Right']
switch-windows=['<Alt>grave']
switch-windows-backward=['<Shift><Alt>grave']
toggle-fullscreen=['<Control><Super>f']
toggle-maximized=@as []
unmaximize=['<Control><Super>Down']

[org/gnome/desktop/wm/preferences]
action-double-click-titlebar='none'
action-middle-click-titlebar='none'
button-layout='close:'
mouse-button-modifier='<Super>'
resize-with-right-button=false

[org/gnome/mutter]
edge-tiling=false
experimental-features=['scale-monitor-framebuffer', 'x11-randr-fractional-scaling']
overlay-key=''
workspaces-only-on-primary=true

[org/gnome/mutter/keybindings]
switch-monitor=['XF86Display']
toggle-tiled-left=['<Control><Super>Left']
toggle-tiled-right=['<Control><Super>Right']

[org/gnome/mutter/wayland/keybindings]
restore-shortcuts=@as []

[org/gnome/settings-daemon/plugins/color]
night-light-enabled=true

[org/gnome/settings-daemon/plugins/media-keys]
control-center=['<Alt><Super>comma']
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/']
help=@as []
magnifier=@as []
magnifier-zoom-in=['<Super>equal']
magnifier-zoom-out=['<Super>minus']
rotate-video-lock-static=['XF86RotationLockToggle']
screenreader=@as []
screensaver=@as []
search=@as []
terminal=@as []

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Alt><Super>t'
command='ghostty'
name='Ghostty'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Alt><Super>e'
command='emacsclient --no-wait --create-frame --alternate-editor='
name='Emacs'

[org/gnome/settings-daemon/plugins/power]
ambient-enabled=true
power-button-action='suspend'
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='nothing'

[org/gnome/shell/extensions/dash-to-dock]
dash-max-icon-size=56
dock-fixed=false
dock-position='BOTTOM'
extend-height=false
shortcut=['']
shortcut-text=''

[org/gnome/shell/extensions/ding]
check-x11wayland=true
show-home=false
start-corner='top-right'

[org/gnome/shell/extensions/nightthemeswitcher/time]
manual-schedule=false
nightthemeswitcher-ondemand-keybinding=['']
sunrise=-nan
sunset=-nan

[org/gnome/shell/keybindings]
focus-active-notification=@as []
shift-overview-down=@as []
shift-overview-up=@as []
toggle-application-view=['<Alt>space']
toggle-message-tray=@as []
toggle-overview=['<Alt>Tab']
toggle-quick-settings=@as []

[org/gnome/system/location]
enabled=true

